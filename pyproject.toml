[project]
name = "ClipNest"
version = "0.1.0"
description = "纯离线剪贴板历史库，零配置、无云端，一键找回任何复制瞬间。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "viztracer>=1.1.0",
]
